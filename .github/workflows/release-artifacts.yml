name: Release Artifacts

# Manual-only: this workflow does NOT run automatically on tag push.
# Trigger it from the Actions tab (Run workflow) and supply the tag to release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.7.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew --no-daemon test jarAll

      - name: Collect release files
        run: |
          mkdir -p release-assets
          cp build/libs/propertee-java-java7.jar release-assets/
          cp build/libs/propertee-java-java8.jar release-assets/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ inputs.tag }}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "Automated release for $TAG_NAME"
          fi
          gh release upload "$TAG_NAME" release-assets/* --clobber
